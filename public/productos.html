
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos</title>

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 25px;
            color: #1e293b;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,.1);
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 { margin: 10px 0; }

        h2 { margin-top: 30px; }

        input {
            width: 100%;
            padding: 12px;
            margin: 7px 0 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            margin: 3px;
        }

        button:hover { background: #1d4ed8; }

        .eliminar, .salir { background: #dc2626; }
        .eliminar:hover, .salir:hover { background: #b91c1c; }

        .formulario {
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .tabla-contenedor { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }

        th {
            background: #2563eb;
            color: white;
        }

        #mensaje {
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>

<body>
<div class="container">

    <div class="top">
        <h1>Gestión de Productos</h1>
        <button class="salir" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>

    <h2>Registrar producto</h2>

    <form id="productoForm" class="formulario">
        <input id="nombre" type="text" placeholder="Nombre del producto" required>

        <input id="descripcion" type="text" placeholder="Descripción" required>

        <input id="precio" type="number" min="0" step="0.01" placeholder="Precio" required>

        <input id="stock" type="number" min="0" step="1" placeholder="Stock" required>

        <input id="categoria" type="text" placeholder="Categoría" required>

        <button type="submit" id="guardar">Registrar producto</button>
        <button type="button" id="cancelar" hidden onclick="cancelarEdicion()">Cancelar edición</button>
    </form>

    <p id="mensaje"></p>

    <h2>Productos registrados</h2>

    <div class="tabla-contenedor">
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Categoría</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="listaProductos"></tbody>
        </table>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');
    const formulario = document.getElementById('productoForm');
    const mensaje = document.getElementById('mensaje');
    const lista = document.getElementById('listaProductos');

    let productoEditando = null;
    let productosActuales = [];

    if (!token) {
        window.location.href = '/';
    }

    async function peticion(url, metodo = 'GET', datos = null) {
        const opciones = {
            method: metodo,
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            }
        };

        if (datos) {
            opciones.body = JSON.stringify(datos);
        }

        const respuesta = await fetch(url, opciones);
        const resultado = await respuesta.json();

        if (!respuesta.ok) {
            throw new Error(resultado.mensaje || 'Ocurrió un error');
        }

        return resultado;
    }

    async function cargarProductos() {
        try {
            productosActuales = await peticion('/api/products');
            lista.innerHTML = '';

            if (productosActuales.length === 0) {
                lista.innerHTML = `
                    <tr>
                        <td colspan="6">No hay productos registrados todavía.</td>
                    </tr>
                `;
                return;
            }

            productosActuales.forEach(producto => {
                const fila = document.createElement('tr');

                const valores = [
                    producto.nombre,
                    producto.descripcion,
                    '$' + Number(producto.precio).toFixed(2),
                    producto.stock,
                    producto.categoria
                ];

                valores.forEach(valor => {
                    const celda = document.createElement('td');
                    celda.textContent = valor ?? '';
                    fila.appendChild(celda);
                });

                const acciones = document.createElement('td');

                const editar = document.createElement('button');
                editar.textContent = 'Editar';
                editar.onclick = () => prepararEdicion(producto);

                const eliminar = document.createElement('button');
                eliminar.textContent = 'Eliminar';
                eliminar.className = 'eliminar';
                eliminar.onclick = () => eliminarProducto(producto._id);

                acciones.appendChild(editar);
                acciones.appendChild(eliminar);
                fila.appendChild(acciones);

                lista.appendChild(fila);
            });

        } catch (error) {
            mensaje.style.color = 'red';
            mensaje.textContent = error.message;
        }
    }

    formulario.addEventListener('submit', async (e) => {
        e.preventDefault();

        const datos = {
            nombre: document.getElementById('nombre').value.trim(),
            descripcion: document.getElementById('descripcion').value.trim(),
            precio: Number(document.getElementById('precio').value),
            stock: Number(document.getElementById('stock').value),
            categoria: document.getElementById('categoria').value.trim()
        };

        try {
            if (productoEditando) {
                await peticion(
                    `/api/products/${productoEditando}`,
                    'PUT',
                    datos
                );
                mensaje.textContent = 'Producto actualizado correctamente.';
            } else {
                await peticion('/api/products', 'POST', datos);
                mensaje.textContent = 'Producto registrado correctamente.';
            }

            mensaje.style.color = 'green';
            formulario.reset();
            cancelarEdicion();
            await cargarProductos();

        } catch (error) {
            mensaje.style.color = 'red';
            mensaje.textContent = error.message;
        }
    });

    function prepararEdicion(producto) {
        productoEditando = producto._id;

        document.getElementById('nombre').value = producto.nombre;
        document.getElementById('descripcion').value = producto.descripcion;
        document.getElementById('precio').value = producto.precio;
        document.getElementById('stock').value = producto.stock;
        document.getElementById('categoria').value = producto.categoria;

        document.getElementById('guardar').textContent = 'Guardar cambios';
        document.getElementById('cancelar').hidden = false;

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelarEdicion() {
        productoEditando = null;
        formulario.reset();
        document.getElementById('guardar').textContent = 'Registrar producto';
        document.getElementById('cancelar').hidden = true;
    }

    async function eliminarProducto(id) {
        if (!confirm('¿Deseas eliminar este producto?')) return;

        try {
            await peticion(`/api/products/${id}`, 'DELETE');
            mensaje.style.color = 'green';
            mensaje.textContent = 'Producto eliminado correctamente.';
            await cargarProductos();

        } catch (error) {
            mensaje.style.color = 'red';
            mensaje.textContent = error.message;
        }
    }

    function cerrarSesion() {
        localStorage.removeItem('token');
        window.location.href = '/';
    }

    cargarProductos();
</script>

</body>
</html>
